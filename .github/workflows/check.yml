name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.18+6c83a7f62
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update registry
        run: moon update
      - name: Interfaces are up to date
        run: |
          moon info
          if ! git diff --quiet; then
            message=$(git diff --stat | tail -6 | tr '\n' ' ' | cut -c1-700)
            echo "::error title=generated interfaces are stale::$message"
            git diff --stat
            exit 1
          fi
      - name: Check (js)
        run: |
          set +e
          moon check --target js --deny-warn > check.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            message=$(tail -12 check.log | tr '\n' ' ' | cut -c1-700)
            echo "::error title=moon check (js) failed::$message"
            cat check.log
            exit $code
          fi
      - name: Check (wasm)
        run: moon check --target wasm --deny-warn
      - name: Test (js)
        run: |
          set +e
          moon test --target js > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            message=$(grep -E "FAILED|failed|Error" test.log | tail -6 | tr '\n' ' ' | cut -c1-700)
            echo "::error title=moon test (js) failed::$message"
            cat test.log
            exit $code
          fi
      - name: Test (wasm)
        run: moon test --target wasm
      - name: First-parent fixture example
        run: moon run --target js examples/first_parent
      - name: Git import example
        run: moon run --target js examples/git_import
